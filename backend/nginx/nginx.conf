# =============================================================================
# Makemake — Phase 8.1 Load Balancer config
#
# Listens on :8080 and distributes traffic to two backend instances:
#   :3000  (Server 1)
#   :3001  (Server 2)
#
# What this config handles:
#   1. HTTP  —  all REST API calls
#   2. WebSocket  —  the /ws upgrade (must forward Upgrade + Connection headers)
#   3. Health-aware routing  —  instances returning 5xx are temporarily removed
#      from rotation (passive health checks via proxy_next_upstream)
#
# Run from the backend directory:
#   nginx -c nginx/nginx.conf -p .
# Stop:
#   nginx -c nginx/nginx.conf -p . -s stop
# =============================================================================

# Worker configuration
worker_processes 1;

# Error log and pid placed inside the backend directory for easy cleanup
error_log  /tmp/makemake-nginx-error.log warn;
pid        /tmp/makemake-nginx.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Upstream — the two backend instances.
    #
    # nginx default algorithm is round-robin: each new request goes to the
    # next server in order. That's exactly what we want to demonstrate that
    # :8080 distributes traffic across both instances.
    #
    # max_fails / fail_timeout: passive health check.
    #   - If a backend returns a connection error (or 5xx, see proxy_next_upstream)
    #     max_fails times within fail_timeout seconds, nginx marks it as
    #     temporarily unavailable and stops sending requests to it.
    # -------------------------------------------------------------------------
    upstream makemake_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    }

    # -------------------------------------------------------------------------
    # Logging — write to /tmp so we don't need root or special directories
    # $upstream_addr shows which backend instance handled the request.
    # -------------------------------------------------------------------------
    log_format makemake '$remote_addr [$time_local] "$request" '
                        '$status upstream=$upstream_addr';
    access_log /tmp/makemake-nginx-access.log makemake;

    # -------------------------------------------------------------------------
    # Map the "Upgrade" header for WebSocket support.
    #
    # For a normal HTTP request, $http_upgrade is empty string, so
    # $connection_upgrade becomes "close".
    # For a WebSocket upgrade, $http_upgrade is "websocket", so
    # $connection_upgrade becomes "upgrade".
    #
    # This map is what makes HTTP and WS work through the same upstream.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default  "upgrade";
        ""       "close";
    }

    server {
        listen 8080;
        server_name localhost;

        # ------------------------------------------------------------------
        # /ws  — WebSocket endpoint
        #
        # WebSocket connections are long-lived, so we need:
        #   - proxy_http_version 1.1   (HTTP/1.1 required for Upgrade)
        #   - proxy_set_header Upgrade  $http_upgrade
        #   - proxy_set_header Connection  $connection_upgrade
        #   - proxy_read_timeout long enough to not drop idle connections
        #
        # nginx selects a backend via round-robin at connection time.
        # Once the WS connection is established, all frames stay on that
        # upstream instance — the connection is NOT re-balanced mid-stream.
        # This is correct: the in-process socket lives on that instance, and
        # Redis pub/sub delivers cross-instance events anyway.
        # ------------------------------------------------------------------
        location /ws {
            proxy_pass         http://makemake_backend;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # Forward real client IP and host (useful for logging/debugging)
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Don't timeout long-lived idle WebSocket connections.
            # 1 hour is generous; a real deployment would tune this lower.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ------------------------------------------------------------------
        # Everything else — HTTP REST API
        #
        # proxy_next_upstream: if a backend fails (connection refused, 5xx),
        # nginx retries the request on the next healthy backend.
        # We exclude POST/PATCH/DELETE from retry (non-idempotent) — nginx
        # does this by default for HTTP errors on non-idempotent methods.
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://makemake_backend;
            proxy_http_version 1.1;

            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retry on connection failure or upstream errors (GET / HEAD only by default)
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
